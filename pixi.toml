[workspace]
authors = ["Bing.Guo <bing.guo@som.umaryland.edu>"]
channels = ["conda-forge", "bioconda"]
name = "snp_call_nf"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "osx-64"]
version = "0.2.0"

[tasks]
install = "pixi install --locked"
prep-ref = "cd ref && python prep_ref_files.py"
prep-enadata = "cd ena_data && bash download_ena_data.sh"

test-stub-default = "nextflow run main.nf -stub"
test-stub-partial-parasite-reads-only = "nextflow run main.nf -stub --parasite_reads_only"
test-stub-partial-coverage-only = "nextflow run main.nf -stub --coverage_only"
test-stub-partial-gvcf-only = "nextflow run main.nf -stub --gvcf_only"

test-default = "nextflow main.nf -profile pixi,standard"
test-split = "nextflow main.nf -profile pixi,standard --split intervals"
test-vqsr = "nextflow main.nf --vqsr true -profile pixi,standard,test"
test-ena = {cmd = "nextflow main.nf -profile pixi,standard --fq_map ./ena_data/ena_fastq_map.tsv", depends-on = ["prep-enadata"]}

# --------------------------------------------------------------------------------------
test-stub = { depends-on = ["test-stub-default", "test-stub-partial-parasite-reads-only", "test-stub-partial-coverage-only", "test-stub-partial-gvcf-only"  ] }
test = {depends-on = ["prep-ref", "test-default", "test-default", "test-default"]}
test-hpc-slurm = "pixi run nextflow main.nf -profile pixi,slurm"

[dependencies]
nextflow = "26.4.6.*"
gatk4 = "4.6.2.0.*"
bowtie2 = "2.5.4.*"
bedtools = "2.31.1.*"
samtools = "1.20.*"
bcftools = "1.20.*"
requests = ">=2.34.2,<3"
wget = ">=1.25.0,<2"
